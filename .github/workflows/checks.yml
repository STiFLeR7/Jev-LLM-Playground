name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
      - run: npm run eval
      - run: npm run eval -- --config data/support-routing-v1.json
      - run: node playground.mjs replay --report doc/results/jev-test-2026-09-21.json
      - run: node benchmark.mjs --config data/support-routing-v2.json
      - run: node benchmark.mjs --replay doc/results/benchmark-v2-live-2026-09-21.json
      - run: node benchmark.mjs --config data/support-routing-v3.json
      - run: node benchmark.mjs --replay doc/results/benchmark-v3-live-2026-09-21.json
